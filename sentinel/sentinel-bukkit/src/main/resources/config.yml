# =============================================================
# Sentinel - Configuration principale
# =============================================================

# Type de stockage : "sqlite" (par defaut) ou "postgresql" (optionnel).
storage:
  type: sqlite
  # Parametres utilises uniquement si type: postgresql
  postgresql:
    host: localhost
    port: 5432
    database: sentinel
    username: sentinel
    password: ""

# Seuils de niveau de risque, appliques au score global (0-10).
# score >= moyen     -> FAIBLE
# score >= eleve     -> MOYEN
# score >= critique  -> ELEVE
# score < critique   -> CRITIQUE
thresholds:
  moyen: 7.5
  eleve: 5.0
  critique: 2.5

# Activation et ponderation de chaque verification.
# "weight" multiplie l'impact brut de la verification sur le score.
checks:
  premium-account:
    enabled: true
    weight: 1.0
  client-brand:
    enabled: true
    weight: 1.0
  network-threat:
    enabled: true
    weight: 1.0
  reputation:
    enabled: true
    weight: 1.0

# Fournisseurs de reputation externes actives (identifiants libres,
# a faire correspondre a vos implementations de ReputationProvider).
reputation-providers: []

# Service de detection VPN/Proxy/Tor a utiliser (identifiant libre,
# a faire correspondre a votre implementation de NetworkThreatService).
network-threat-service: noop

# Action appliquee selon le niveau de risque final.
# Valeurs possibles : allow, warn, deny
actions:
  faible: allow
  moyen: allow
  eleve: warn
  critique: deny
