# Build Sentinel
name: Build Sentinel

on:
  push:
    branches: [ "main" ]
    paths:
      - "sentinel/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "sentinel/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sentinel

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation du JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Setup gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build (compilation + tests + jars)
        run: gradle build --stacktrace

      # Jar plugin
      - name: Upload du plugin BungeeCord (jar complet)
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-bungee
          path: sentinel/sentinel-bungee/build/libs/*.jar
          if-no-files-found: error

      # Upload others jar's.
      - name: Upload des jars des modules internes
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-modules-internes
          path: |
            sentinel/sentinel-api/build/libs/*.jar
            sentinel/sentinel-common/build/libs/*.jar
            sentinel/sentinel-core/build/libs/*.jar
          if-no-files-found: warn